schema: spec-driven
context: |
  本项目是 DesignCraft 六项独立技能的维护源，当前版本 0.1.0-dev.1，固定原生 CLI 0.2.1。
  规范、设计及任务使用中文；需求关键字 MUST/SHALL 与 Scenario 结构保留英文。
  共享运行时、命令网关、执行回执与领域技能契约在本项目维护。
  designcraft-plugin 消费技能快照，维护插件本地 Harness、宿主适配与发行门禁。
  原生安装、真实创作、宿主、CI、目标平台和发行证据分别记录。
  优化变更已进入实施；离线代码与测试进度不代表原生、宿主、创作或发行验收通过。
rules:
  specs:
    - 每项 requirement 必须包含可观察行为和至少一个 WHEN/THEN 场景。
    - 区分既有实现、目标行为和待验证原生能力，不把研究源码当作固定发行契约。
  tasks:
    - 标明优先级、需求编号、验收证据和跨项目依赖；未实现任务保持未勾选。
